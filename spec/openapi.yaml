          required: false
          example: [table]
          style: form
          explode: true
          description: >-
            Keep only blocks of these kinds: 1 to 10 of `text`, `heading`, `code`, `math`, `divider`, `interactive`, `table`, `image`, `embed`, `media`, an open set, one value per repeated key. Default: every kind.
          schema:
            type: array
            minItems: 1
            maxItems: 10
            uniqueItems: true
            items:
              type: string
              minLength: 1
              examples: [table, text, heading, code, math, divider, interactive, image, embed, media]
              description: >-
                One of the block kinds the field lists.
        - name: section_id
          in: query
          required: false
          description: >-
            Keep only the blocks of this section and of the sections under it, an `s` id from the map. Default none.
          schema:
            type: string
            pattern: '^s[0-9]+$'
