          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentsUpload'
              examples:
                upload_contents.delivered:
                  summary: A ten-page PDF with a text layer, parsed whole within the wait
                  value: {"contents": {"id": "cnt_2Kp0zzrSBNSNtgjapZm9pq", "outcome": {"kind": "delivered", "reason": "whole"}, "notices": [], "fetched_at": "2026-11-04T10:05:00Z", "fingerprint": "sha-256=:Ab3QtW7hCl7ACP+qfkR6P97Od1HtkFFDIcl9B4pPos0=:", "scope": "main",
                      "record_scope": "main", "formats": ["markdown"], "truncated": false, "markdown": "# Minutes of the meeting…", "counts": {"characters": 18400, "blocks": {"heading": 6, "text": 40}, "links": {}},
                      "source": {"redirects": [], "media_type": "application/pdf", "carrier": "upload", "filename": "minutes.pdf", "document_digest": "sha-256=:7HqC7GihbMvNe0QRGihXoSzWNR2cLpquMihXOseZoSw=:", "title": "Minutes", "authors": [], "published_date": "2026-09-01", "published_date_precision": "day", "published_date_basis": "document_properties", "modified_date": null, "language": "en", "language_versions": [], "robots": "not_applicable", "declared_terms": [], "structured_data": [], "origins": []},
