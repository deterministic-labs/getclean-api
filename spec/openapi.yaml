openapi: 3.1.0
info:
  title: getclean API
  version: 1.0.3
  description: |-
    getclean is the data layer for research agents. Every call is shaped around one step of research, and every answer is made to be reasoned from and cited. Give it a URL, a file or a question. What comes back answers the questions a researcher has of a source. What it says, exactly: the main content with every heading, table, merged cell, strikethrough and word as the source carries them, the same on every read. Where it says it: section and block ids that hold across every read, and the places where your own words or questions stand. As of when: the dates the source declares, and on request the page as an archive kept it on a past day. Whether to trust it: what the page hides, what was left out, who publishes it, and what it declares about its use. What changed since you last looked: a fingerprint, and a comparison block by block and cell by cell. What it cost: a ceiling you set before, and the bill after.

    Every record is kept, unless the account's `retention` turns keeping off, so every later read of the same source is answered from the same copy, free; a summary, a schema fill or a judged highlight on it costs one model step. No model judges the content unless you ask for it: the summary, the schema fill and the judged highlights are steps you name, each listed in the answer with its version, and `deterministic_only` turns every judging step off. Two steps run on their own and are listed too: text recognition on a scanned page, a fixed step that repeats under one version, and the identification of a publisher getclean has not seen before, which costs you nothing. A search runs two model steps by default, the ranking of its results and the choice of sources; the same switch turns them off.

    There are two groups of calls, called families here. The contents family takes one source, a web page or a document, by URL or as a file, and makes its record: the content in the formats you ask for, the map of its sections, its blocks and links, the places where it says a thing, the facts of the source, a fingerprint and the price. The search family runs one question, in up to twenty wordings, on up to ten datasources at once, merges the results into one ranked list, and returns them with their facts and a receipt of what ran where, before any page is read. A fetch or a search answers with a record that has an id, `cnt_` for a source and `srch_` for a search, which every later call names.

    Every record carries an `outcome`, the first thing to read: what happened at the source, never an HTTP status. A page that could not be read is still a record, whose outcome says why and what may work next, and the bill follows the outcome: a read that failed, was refused or needs a person costs nothing. Only a request getclean itself refuses, a bad field, a missing credential, a cap too low, is an HTTP error, with a problem body that says who must act.

    ## The words this contract uses

    - A record is one result of one billed call. It is kept 48 hours after its last call and at most 30 days from its making; `expires_at` names the moment, and every call on the record moves it forward within that cap. After that, a call on the record is `410` for 30 days, then `404`.
    - A page is a web page at a URL. A document is a file, read at a URL or uploaded; a document page is one page of such a file; a page of results is one page of a list. Page alone means a web page.
    - A character is one Unicode code point. Every text limit, `max_characters` among them, counts characters so.
    - A closed set lists every value a member will ever take. An open set lists the values served now, and a later version may add one, so read an unknown value as a new one, never as an error.
    - The key is whichever credential you sent, an API key or an access token. A field that depends on the key, such as the cap on one call, reads the account that credential stands for.
    - The smallest call is a call with nothing extra: one `contents` unit for a fetch, one `searches` and one `datasource_queries` unit for a search. A cap below it is refused before any work.
    - A run groups records under one budget. Every key has one run, `run_default`, and this contract names no other.
    - The kind of source, `carrier`, is `web` for a live page, `archive` for an archive's copy of a page read under `as_of_date`, and `upload` for bytes you sent.
    - A view of a page is `main`, the main content alone, or `whole_page`, everything on the page; the field is `scope`. A document has one view.

    ## The credential

    Every call carries `Authorization: Bearer <key>`. The bearer value is an API key from `https://app.getclean.ai` or an access token issued by `https://auth.getclean.ai/realms/getclean`. Either resolves to one account with its scopes, its cap on one call, its budgets, its policy and its default run. A credential in the query string is ignored. A call with no usable credential is answered `401` with `WWW-Authenticate: Bearer realm="getclean", resource_metadata="https://api.getclean.ai/.well-known/oauth-protected-resource"`. That address serves the API's protected resource metadata (RFC 9728) to anyone, outside the versioned paths, with `Cache-Control: max-age=3600`: `resource` `https://api.getclean.ai`, `authorization_servers` the one issuer, `scopes_supported` the nine scopes, `bearer_methods_supported` `["header"]`. It is not an operation of this contract. An agent that arrives with nothing follows it to the issuer and its device sign-in.

    ## HEAD, 405 and 406

    Every `GET` of both families answers `HEAD` at once with the headers the `GET` would send and no body; a `HEAD` on `get_job` does not wait. The contract declares no `HEAD` operations. A method the resource does not offer is answered `405` with `Allow`; a representation it cannot give, `406`; each a problem of type `about:blank` whose title is the status's reason phrase. The contract declares neither per operation.

    ## What every answer promises, and what it does not

    - The reason `whole` means that everything you asked for fit. It does not promise that what came is the article: a page that is not what its address promises can come back as content, an error page sent with status 200, a subscription offer, a page with no main content, a portal that shows its results only inside a session. `not_found` comes from the status code alone.
    - A challenge, a block, a sign-in page or a purchase wall is recognized by signs in the response or on the page, never by its words. Such a sign decides before the status code. A wall with no known sign comes back as content. A page that declares its content not free carries the notice `paywall_declared`, whatever came.
    - The main content is what getclean keeps as the page's substance. It can leave real content out as another part; `left_out` names the kinds and sizes left out, and `get_contents` with `scope: whole_page` shows the rest, free. When no main content is found but the page has text or links, the whole page is delivered under `scope: whole_page` with the notice `no_main_content`.
    - Some regions of a page cannot be read as text. Where such a region covers part of the main content, the notice `unread_region` names its kind and size. A feed that grows as it is scrolled is read to a limit, never to its end. A frame from another site is an `embed` block with its address.
    - A page is read for at most `wait_seconds` and measured as it stands at that moment. A page still changing then carries the notice `not_settled`. The reason `deadline` means only that nothing readable had come by then.
    - Text that a reader of the page cannot see is kept apart in `hidden_text`, with the reason, never mixed into the content. Text hidden in a way getclean does not detect comes back as content. Hidden text is looked for in web pages and HTML files only. Keeping it apart is the default, since nothing is lost.
    - `title`, `authors`, `published_date`, `published_at`, `modified_date`, `publisher`, `canonical_url`, `language`, `language_versions`, `structured_data` and `declared_terms` are what the page or the document declares about itself; getclean does not check them against the content. A document's own dates often record when the file was made.
    - On a page whose headings are styled text rather than heading markup, the heading levels follow the styling and may nest wrongly.
    - The default sizes, `max_characters` 20,000 among them, were chosen with Latin script in mind. A text in a denser script, Chinese or Japanese, holds more in the same count, and no default is set per script.
    - A price that reads 0 may not be the price the page shows; check `counts` and the page's kind before trusting it.
    - The fingerprint compares only within one `scope`, one `execution.version`, one `execution.configuration` and one kind of source. A different fingerprint means the kept text differs, not that the article changed, since a site can serve two visits two different pages. `compare_contents` shows where.
    - On a web page, `unchanged` still reads the page in full and bills the fetch; what it saves is the text not sent and your agent's time, never the price. On a document whose bytes match the fingerprint's record, no page is parsed or billed.
    - Under one `execution.version` and `execution.configuration`, the same page or the same bytes give the same content and the same `s` and `b` ids on every call. A model step names its version and is not promised to repeat; `exact` and `near` matches repeat.
    - `challenge_served` may repeat on sites that challenge every new visitor.
    - Text inside images is not recognized on a page or a document that has a text layer; your agent reads it from `image.url`.
    - A link's kind is taken from its address, a guess; no request is made per link, so a link carries no size or served type.
    - An archive copy is the page as the archive served it, its links pointing into the archive. `fetched_at` is when getclean read the copy. `robots` is the site's own robots file as read now.
    - `page_number` is the page's position in the file, counted from 1; `page_label` is the label the document itself prints on the page, where it declares one.
    - A page that redirects elsewhere is delivered as what arrived; `final_url` and `redirects` show the path, and the notice `redirected` says when the final URL differs beyond the scheme, the host's case, a trailing slash and tracking parameters. Whether it is still the source is your agent's call.
    - `fetched_at` is getclean's own clock; no outside time source signs it.
    - A document's own arithmetic is not checked. Cells come as displayed, `formula_cells` says where a formula stood on a spreadsheet, and whether the figures satisfy the document's totals is your agent's check from the table's cells.
    - A highlight's place is a block id, a section id and the words as found, with a mark in the text returned, never an offset in characters, since the text is markdown whose offsets move with every mark and every format.
    - What this API does not do, and what it answers instead:
      - translate a page, or transcribe a recording; a recording's time ranges and frames: `unsupported_media_type`;
      - read a structure too large to take whole by its rows or a named column: `too_large`, with the count read;
      - sign in to a site for a fetch by URL: `sign_in_needed`; a registered login serves only a fetch made inside a search;
      - compose a text in force from its amendments, fill a template from several documents, or group copies: your agent's work, from each record's blocks and ids.
    - The price of a document is unknown before the call, since its page count is known only once it is downloaded. `max_cost` is the protection, and a fetch at the smallest call's price with `max_characters: 0` returns `pages.count` and the outline for one `contents` unit.
    - What your agent does from a record, with its blocks, ids and digests:
      - compare a clause with a clause of another document;
      - parse a displayed number, or a document's number format, which getclean does not declare;
      - judge whether a text was written by a machine, which getclean does not judge;
      - match two images, which getclean matches by identical bytes only; a web image's bytes are not kept;
      - read a reporter's page citation from an opinion's text.
    - A page exists only where the format has pages. A web page carries no page, and a page number printed in its text is your agent's to read.
    - An uploaded HTML file is read from its bytes alone, with nothing fetched and nothing run, so the styles, scripts and images it only points to are not loaded and its main content may differ from what the person saw; no screenshot is made.
    - A baseline you hold yourself is the whole text the record returned, since its hash is checked; a partial text cannot be compared.
    - What getclean did to a page is described by its published configuration at its version, with `left_out` and `hidden_text`; there is no log per read beyond them.
    - A markup change that keeps the text and its order is invisible to the comparison, since the record is the content.
    - A recognized page comes in the reading order the recognition produced, unmarked; headings come as text; pictures inside the page are not separated; a region the source blacked out is not told apart from a failed recognition.
    - An agent that checks a page again after its record expired gets `fingerprint_unknown` and pays the full price; it keeps the earlier text itself and compares with `compare_contents`.
    - A second-factor prompt counts as a sign-in page.
    - Content inside an app is not read; only pages and documents are.
    - The API has no field for a referrer or for a site's own settings; a setting reaches the read only through the URL.
    - A page's `declared_terms` are the page's; an image's licence is read on the image's own page.
    - getclean pays no site for a page. A page that asks a price ends `payment_required`, with the price in `cost.source_price`.
servers:
  - url: https://api.getclean.ai
security:
  - bearer: []
paths:
  /v1/contents:
    post:
      operationId: fetch_contents
      summary: Fetch contents
      description: |-
        Fetch a web page or a document at a URL. You get its main content with the structure intact, in the formats you ask for, the map of its sections, the facts of the source, a fingerprint and the price, as one record that is kept for later reads.

        The record is kept 48 hours after its last call and at most 30 days from its making, and every later question about it, through `get_contents`, `get_section`, `list_blocks` and `list_links`, is answered from the same copy, free. Use `upload_contents` for a file you hold, or for a long document that must run as a job; use `search` when you have a question and no URL yet; use `get_contents` to read a record you already have.

        **What it costs.** The key needs `contents:fetch`, plus `contents:model` when you send `json_schema`, set `summary` or send `highlights` without `deterministic_only`; getclean decides this from the request before any work, so a missing scope is `403` before any `422`. The price is 1 `contents`, plus `document_pages` and `recognized_pages` when the URL serves a document, plus `model_steps` for each model field that ran, plus `screenshots` when one was made. An `unchanged` answer bills the same 1 `contents`. A fetch that failed, was refused or needs a person bills nothing.

        **What comes back.** `201 Created`, with `Location` naming the record, for every outcome kind: a page that could not be read is still a record, whose `outcome` says what happened and what may work next. The record carries what happened, the notices to read first, when the fetch ran, its fingerprint, the content or the map, the facts of the source and the price.

        **The idempotency key.** `Idempotency-Key` is optional here. The same key with the same body returns the first answer again, with this call's `request_id`, `expires_at` as it stands and `replayed` true on `cost`; nothing is billed again. The same key while the first call still runs is `409 idempotency-key-in-flight`; the same key with another body is `422 idempotency-key-reused`. A replay whose record was deleted is `404 not-found` naming the deletion.

        **How the text fits `max_characters`.**
        - It fits: the text formats come whole; the reason is `whole`; `truncated` is false.
        - It does not fit: no text format comes; `sections`, the map, comes instead; the reason is `sections_only`; `truncated` is true. `screenshot` and `raw_html` still come.
        - It does not fit and a highlight was found: the sections that hold highlights come in document order while they fit; a section larger than what remains is cut at a block edge with its highlighted blocks inside; the map comes too, as with `max_characters: 0`, and does not count against the limit; the reason is `matching_sections`; `truncated` is true; `get_section` has the rest.
        - `max_characters: 0`: no text; the map comes; the reason is `whole`; `truncated` is false; `screenshot`, `raw_html` and `links` still come, the links within their cap.
        - The map always carries level 1 and `s0`, however many rows. Deeper levels come one whole level at a time from the top, while their rows fit `max_characters`; under `0`, while the rows number at most 200. The notice `sections_cut` says when levels were left out.
        - Two text formats each carry the whole content, so the answer is twice as long; `max_characters` bounds the content once, and each format carries it.
        - A sent `max_characters` with no text format bounds nothing and makes the notice `field_not_applicable`; the default makes none. `links`, `screenshot` and `raw_html` are outside it.
        - To learn a document's size and price for one `contents` unit, send `max_characters: 0` with `max_cost` at the smallest call's price: no page is parsed beyond the count and the outline.

        **The formats.** `block_kinds` narrows every format: the text formats and `links` hold only those blocks, and `highlights`, `json_schema` and `summary` read only those blocks; `whole` then means all of them fit; `counts` stays the page's. `scope: whole_page` makes the blocks, the sections and the counts cover the whole page, and `left_out` is `[]`. A highlight is marked `<mark id="h1">…</mark>` in `markdown` and `html` and listed in `highlight_ids` on `blocks`; nothing is marked in `doclang`, `links`, `screenshot` or `raw_html`; with no text returned, the `highlights` list still comes with its ids and places. Every occurrence of a string is a highlight, in document order, at most 50 per call, with the notice `highlights_cut` past that. `highlights`, `json_schema` and `summary` read the whole content, or the chosen blocks, whatever `max_characters` says; the bound limits what is returned, not what they read. `summary` is at most 1,500 characters, in the content's language. `summary` and `schema_values` carry no link and no image; any a model writes is removed with the notice `model_link_removed`, and a URL value is kept only when it stands in the record's links or text.

        **Each highlight string.**
        - Found `exact`: its words stand in one block, after Unicode normalization and whitespace collapse, case kept. Free.
        - Found `near`: its words stand there after case folding, with ellipses and the punctuation at the ends of words removed, punctuation inside a word kept, pieces in order, and the dotted and dotless i of Turkic scripts folded to one. Free.
        - Not found verbatim: a model picks the blocks that bear on it, `judged`. One model step per call, however many strings needed it.
        - Not found, and nothing bears on it, or `deterministic_only`: the notice `highlight_not_found`, one per string. The step's price when a model judged it, free under `deterministic_only`.

        **`deterministic_only`.** Nothing runs whose output could differ between two runs of the same input: highlights are found verbatim only; `json_schema` and `summary` are refused as `model-work-refused`, both fields named in `violations`; the publisher's kind comes only from what getclean already knows. Text recognition on a scanned page still runs and is listed, since it repeats under one version. A key whose policy forbids model work refuses `json_schema` and `summary` with `policy-limit-exceeded` and finds highlights verbatim only; `deterministic_only: false` under such a key is `policy-limit-exceeded`, since a request never loosens the key.

        **`baseline_fingerprint`.** On a page: the page is read in full and its fingerprint compared. If it matches, the answer is `unchanged`: no text, no highlights, no fill, no summary, `formats` echoed `[]`, while the record keeps the content, which `get_contents` reads. On a document at a URL: the bytes are fetched; when a record of your account issued the fingerprint you sent and its `document_digest` equals the bytes' digest, the answer is `unchanged` without a parse; otherwise the parse runs and bills its pages, and a matching content fingerprint then answers `unchanged`. If no record of your account issued the fingerprint, you get the notice `fingerprint_unknown`, and the fetch runs whole at the full price. A fingerprint matches only under the scope, the version, the configuration and the kind of source that made it; one issued under another makes the notice `fingerprint_incomparable`, naming which, and the fetch runs whole at the full price. A fingerprint of a record no longer kept is `fingerprint_unknown` too, so an agent that comes back after its record expired pays the full price and compares fingerprints itself.

        **`as_of_date`.** The record is an archive copy: `source.carrier` is `archive`, `source.archive` names the copy, and `source.archives_consulted` names the archives of `Limits.archives` that answered. The copy is the latest capture at or before 23:59:59 UTC of that day whose archived status was 2xx, so a capture later on that day may come, `archive.captured_at` showing when; an agent that needs the state before an event asks for the day before. `source.next_capture_at` comes when a later capture exists, so an agent steps forward capture by capture. No such copy is `no_history`. `subject_country`, `subject_language`, `screenshot` and `max_source_price` are not applied to an archive copy, a notice each.

        **`screenshot` and `raw_html`.** The screenshot is of the live page only: the whole page at its full width, as PNG, with its digest, by a URL getclean serves for as long as the record lives. It ignores `scope` and `block_kinds`. It is taken on a second visit to the page, which may be served another page. `raw_html` is the page's bytes exactly as the server sent them, decompressed, before any script ran, on an archive copy as the archive served them, with their digest, their size and the `Content-Type` sent; by a URL under `retention` `hold`, inline as `data_base64` under `none`. It ignores `scope`, `block_kinds` and `max_characters`, and it is free. The served bytes and their digest let you show later exactly what the server sent.

        **A document at the URL.** It is parsed inside the fetch. Past `wait_seconds` the pages parsed come back `partial`, `time_capped`, with the notice `upload_to_finish`; past `max_cost` they come back `partial`, `cost_capped`. `pages.count` and the outline come even when no page was parsed.

        **Money, country and version.** `max_cost` is reserved at the start against the ceiling: the lowest of `max_cost`, the key's cap, the run's budget, the key's budget and the balance. It is spent in one order, the read of the page or of the document's pages first, then `json_schema`, `highlights`, `summary` and `screenshot`. When the ceiling, a budget or the deadline cannot cover everything, the extras are cut from the end, each cut a notice naming the field, and the pages are stopped last, the record `partial`. A run's or a key's budget that stops a parse is `budget_capped`, with the notice `budget_cut`. `max_source_price`: getclean pays no site, whatever the value; a site that asks a price ends `failed`, `payment_required`, with the price in `cost.source_price` and the protocol named in the message. `subject_country` is the country the page is read from; a page that says it is not offered there is `region_restricted`, and a site that refuses the visitor with a block page is `blocked`. `pinned_version`: `execution.version` equals it.

        **Fields that do not apply to some sources.** Each is a notice `field_not_applicable` naming the field, never a refusal, so a client that always sends a field still works on every source:
        - `doclang`, `screenshot`, `raw_html` or `scope: whole_page` on a URL that serves a document;
        - `recognition_languages` on a web page;
        - `subject_country`, `subject_language`, `screenshot` or `max_source_price` with `as_of_date`;
        - a sent `max_characters` with no text format;
        - `block_kinds` with nothing to narrow.

        The table under `Contents` says which members each kind of source carries.

        **Refused before any work**, every violation of the body reported at once in `violations`:
        - `scope`, a `formats` value, a `block_kinds` value or `retention` outside its set: `invalid-field`, `not_allowed`.
        - A duplicate in `formats` or `block_kinds`: `duplicate`. An empty `block_kinds` list: `bound`; send `formats: []` for the facts alone.
        - `max_characters` between 1 and 999: `bound`.
        - `json_schema` or `summary` under the request's `deterministic_only`: `model-work-refused`, both fields named.
        - `json_schema`, `summary` or `deterministic_only: false` under a key whose policy forbids model work: `403 policy-limit-exceeded`.
        - `max_cost` below the smallest call's price: `cost-exceeds-cap`, with `minimum_cap`.
        - A scheme other than http or https, a password in the URL's userinfo, or a malformed `baseline_fingerprint`: `syntax`.
        - localhost, an address that is not globally reachable, or a port the Fetch standard lists as bad: `destination-refused`.
        - A host outside the key's domain policy, or a URL the key's `policy.refuse_credential_urls` refuses: `403 policy-limit-exceeded`.
        - A `subject_country` getclean cannot read from: `not_allowed`, with the countries it can read from in `allowed_values`.
        - A `json_schema` that is not valid JSON Schema 2020-12: `syntax`. One whose root is not `type: object`, that has no `properties`, or whose `pattern` needs backtracking: `not_allowed`.
        - An unknown `run_id`: `not_allowed`. `retention: hold` under a `none` policy: `403 policy-limit-exceeded`.
        - A missing `url`: `required`. Any other bound passed: `bound`. An unknown field: `unknown_field`.
        - `pinned_version` not served, never or no longer: `version-withdrawn`, with the versions served.

        The one exclusive pair is `deterministic_only` against `json_schema` and `summary`. No dependent field refuses; `block_kinds` with nothing to narrow is a notice. Every other pair is independent.

        **Notices this operation makes.** `highlight_not_found`, `highlights_cut`, `sections_cut`, `links_cut`, `hidden_text_cut`, `structured_data_cut`, `size_limit`, `conversion_mismatch`, `ad_blocker_failed`, `not_settled`, `unread_region`, `no_main_content`, `paywall_declared`, `redirected`, `requests_blocked`, `field_not_applicable`, `cost_cut`, `budget_cut`, `time_cut`, `step_failed`, `model_link_removed`, `recognition_uncertain`, `tracked_changes`, `upload_to_finish`, `fingerprint_incomparable`, `fingerprint_unknown`, `marks_not_read`, `archive_unreachable`, `default_set_by_policy`, `version_retiring`. `content_not_rendered` is a published code this version does not make.

        **Problem types.**
        - 400 `invalid-request`, The request is invalid.
        - 401 `unauthorized`, The key is missing or rejected.
        - 403 `insufficient-scope`, The key lacks a scope this call needs; `policy-limit-exceeded`, The key's policy forbids this; `credit-exhausted`, The credit is exhausted; `run-budget-exhausted`, The run's budget is exhausted; `key-budget-exhausted`, The key's budget is exhausted.
        - 404 `not-found`, Not found, on a replay whose record was deleted.
        - 409 `idempotency-key-in-flight`, The same request is still running.
        - 413 `body-too-large`, The body is too large.
        - 415 `unsupported-media-type`, The media type is not supported.
        - 422 `invalid-field`, A field is invalid; `destination-refused`, The destination is refused; `model-work-refused`, Model work is refused by the request; `cost-exceeds-cap`, The cost cap is below the smallest call; `version-withdrawn`, The version is no longer served; `idempotency-key-reused`, The idempotency key was reused with another body.
        - 429 `rate-limit-exceeded`, The rate limit is exceeded; `concurrency-limit-exceeded`, Too many calls are in flight.
        - 451 `legal-block`, Withheld under a legal demand.
        - 500 `internal-error`, The service failed.
        - 503 `overloaded`, The service is overloaded.

        **When a record is not delivered.** `outcome.message` says what may work next, and the table under `Outcome.reason` gives it for every reason.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FetchContentsRequest'
            examples:
              fetch_contents.delivered:
                summary: A page fetched with two highlights and a summary
                value: {"url": "https://example.com/q3", "highlights": ["Revenue rose 12%", "what drove the margin"], "summary": true}
              fetch_contents.failed:
                summary: A failed fetch, a bot challenge where the page should be
                value: {"url": "https://shop.example/offer"}
      responses:
        '201':
          description: >-
            The record, `Contents`, for every outcome kind, with `Location` naming it; a fetch that failed, was refused or needs a person is a record too, its `outcome` saying what happened.
          headers:
            Request-Id: {$ref: '#/components/headers/RequestId'}
            RateLimit: {$ref: '#/components/headers/RateLimit'}
            RateLimit-Policy: {$ref: '#/components/headers/RateLimitPolicy'}
            Sunset: {$ref: '#/components/headers/Sunset'}
            Deprecation: {$ref: '#/components/headers/Deprecation'}
            Location: {$ref: '#/components/headers/Location'}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contents'
              examples:
                fetch_contents.delivered:
                  summary: A page fetched with two highlights and a summary
                  value: {"id": "cnt_3Fk9abaUhNX7t2eKkgfd3e", "outcome": {"kind": "delivered", "reason": "whole"}, "notices": [], "fetched_at": "2026-11-04T08:40:12Z",
