        fetched_at:
          type: string
          format: date-time
          description: >-
            When the record's fetch or parse started, RFC 3339 in UTC.
          examples: ['2026-11-04T08:40:12Z']
        fingerprint:
          type: string
          pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'
          description: >-
            The record's fingerprint, as `Contents.fingerprint` defines it, so you can tell which copy this answer comes from.
          examples: ['sha-256=:kw4QGoYGxOYpZ0EZGL+nxMfFUXfrxcp+P0M4EOrEiH4=:']
        document_digest:
          type: string
          pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'
          description: >-
            The sha-256 of the document's bytes in RFC 9530 form, to compare with the file you hold. On a document only.
          examples: ['sha-256=:7HqC7GihbMvNe0QRGihXoSzWNR2cLpquMihXOseZoSw=:']
        scope:
          $ref: '#/components/schemas/Scope'
          description: >-
            The view summarized.
        version:
          type: string
          description: >-
            The version of getclean the record was made under, its `execution.version`.
          examples: [1.0.0]
        configuration:
          type: string
          description: >-
            The configuration the record was made under, its `execution.configuration`.
          examples: [cfg-2026-11]
        expires_at:
          type: string
          format: date-time
          description: >-
            When the record expires. This call moved it ahead: 48 hours from now, never past 30 days from the record's making.
          examples: ['2026-11-06T08:40:12Z']
        summary:
          type: string
          x-third-party: true
          maxLength: 1500
          description: >-
            The model's summary, at most 1,500 characters, in the content's language, with no link and no image markup; an empty string when no block was read. Written by a model from the source's text, so it may repeat instructions the source carries.
        execution:
          $ref: '#/components/schemas/Execution'
          description: >-
            How the call ran; `models` carries the step `summary` with its version when the step ran.
        cost:
          $ref: '#/components/schemas/Cost'
          description: >-
            The bill; `units` `{"model_steps": 1}`, or `{}` when no block was read and the step did not run.
        notices:
          type: array
          description: >-
            The record's own notices first, then this call's; `[]` when none.
          items:
            $ref: '#/components/schemas/Notice'
        request_id:
          type: string
          pattern: '^req_[A-Za-z0-9]{22}$'
          description: >-
            This call's id, the same as the `Request-Id` header.
          examples: [req_01Js1UX1k8Axr2vRanQO5u]
    CompareContentsRequest:
      type: object
      description: >-
        The request of `compare_contents`: the baseline, a record you already have by `baseline_contents_id` or a text you hold yourself by `baseline_markdown` with `baseline_fingerprint`, one of the two required; and the page of changes wanted. An explicit null equals an absent field and gets the default. The object is closed; an unknown field is refused `invalid-field`, `unknown_field`.
      additionalProperties: false
      properties:
        baseline_contents_id:
          type: string
          pattern: '^cnt_[A-Za-z0-9]{22}$'
          description: >-
            The baseline record, a `cnt_` id kept by the same account. One of `baseline_contents_id` and `baseline_markdown` is required; both at once are refused `exclusive`.
          examples: [cnt_3Fk9abaUhNX7t2eKkgfd3e]
        baseline_markdown:
          type: string
          minLength: 1
          maxLength: 1000000
          description: >-
            The markdown you kept, as a record returned it, whole, at most 1,000,000 characters; a partial text cannot be compared, since its hash is checked. With `baseline_fingerprint`, each refused `dependent` without the other.
        baseline_fingerprint:
          type: string
          pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'
          description: >-
            The fingerprint of `baseline_markdown` as the record returned it; a text that does not hash to it is refused `syntax`.
          examples: ['sha-256=:kw4QGoYGxOYpZ0EZGL+nxMfFUXfrxcp+P0M4EOrEiH4=:']
        baseline_version:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The `execution.version` of the record your text came from, at most 64 characters, so the one-version rule can be checked and the text split by the rules that made it; with `baseline_markdown` only, refused `dependent` with `baseline_contents_id`. Default the current record's.
          examples: [1.0.0]
        baseline_scope:
          $ref: '#/components/schemas/Scope'
          description: >-
            The `record_scope` of the record your text came from; with `baseline_markdown` only, refused `dependent` with `baseline_contents_id`. Default the current record's.
        page_size:
          type: integer
          minimum: 1
          default: 50
          description: >-
            At most this many changes on the page, from 1; default 50; the maximum, 200, stands in `Limits.bounds`, and a larger value is lowered with the notice `page_size_lowered`.
        page_token:
          type: string
          minLength: 1
          maxLength: 1024
          description: >-
            The next page of changes, as the last answer's `next_page_token` gave it; bound to this comparison and the body's other fields, `page_size` included. Default none, the first page.
    Comparison:
      type: object
      description: >-
        The answer of `compare_contents`: both sides with their fingerprints, whether anything changed, the whole tally on every page, and the changes block by block, paged.
      required: [contents_id, expires_at, current, baseline, changed, counts, changes, notices, request_id]
      properties:
        contents_id:
          type: string
          pattern: '^cnt_[A-Za-z0-9]{22}$'
          description: >-
            The current record.
          examples: [cnt_9Zze6X8RDFg2XxyKyLlV5T]
        expires_at:
          type: string
          format: date-time
          description: >-
            When the current record expires. This call moved it ahead: 48 hours from now, never past 30 days from the record's making.
          examples: ['2026-11-13T08:40:02Z']
        baseline_contents_id:
          type: string
          pattern: '^cnt_[A-Za-z0-9]{22}$'
          description: >-
            The baseline record. Present when given.
          examples: [cnt_3Fk9abaUhNX7t2eKkgfd3e]
        current:
          $ref: '#/components/schemas/ComparisonSide'
          description: >-
            The current record's side.
        baseline:
          $ref: '#/components/schemas/ComparisonSide'
          description: >-
            The baseline's side; `fetched_at` is absent when the baseline is a text you hold yourself.
        changed:
          type: boolean
          description: >-
            Whether anything differs; true with `changes` `[]` means the words are the same and only their inline formatting moved.
        counts:
          $ref: '#/components/schemas/ComparisonCounts'
          description: >-
            The whole tally, on every page, before the rows.
        changes:
          type: array
          description: >-
            The changes of this page, block by block; `[]` when none.
          items:
            $ref: '#/components/schemas/BlockChange'
        next_page_token:
          type: string
          maxLength: 1024
          description: >-
            The token for the next page of changes; pass it as `page_token`. Present while more remains, and a page that carries it always has at least one change.
        notices:
          type: array
          description: >-
            This call's notices, `fingerprint_incomparable`, `paywall_declared`, `page_size_lowered`, `version_retiring`; `[]` when none.
          items:
            $ref: '#/components/schemas/Notice'
        request_id:
          type: string
          pattern: '^req_[A-Za-z0-9]{22}$'
          description: >-
            This call's id, the same as the `Request-Id` header.
          examples: [req_01JONfNiPNrnysSRQjsH2k]
    ComparisonSide:
      type: object
      description: >-
        One side of a comparison.
      required: [fingerprint, verified]
      properties:
        fetched_at:
          type: string
          format: date-time
          description: >-
            When the side's record was fetched. Absent when the side is a text you hold yourself.
          examples: ['2026-11-04T08:40:12Z']
        fingerprint:
          type: string
          pattern: '^sha-256=:[A-Za-z0-9+/]{43}=:$'
          description: >-
            The side's fingerprint.
          examples: ['sha-256=:kw4QGoYGxOYpZ0EZGL+nxMfFUXfrxcp+P0M4EOrEiH4=:']
        verified:
          type: boolean
          description: >-
            True when getclean checked the side's fingerprint: always on a record, and on a text you hold yourself once its hash matched.
    ComparisonCounts:
      type: object
      description: >-
        The tally of a comparison, by kind of change.
      required: [added, removed, changed, moved]
      properties:
        added:
          type: integer
          minimum: 0
          description: >-
            Blocks only on the current side.
        removed:
          type: integer
          minimum: 0
          description: >-
            Blocks only on the baseline side.
        changed:
          type: integer
          minimum: 0
          description: >-
            Blocks paired above the published similarity whose text differs.
        moved:
          type: integer
          minimum: 0
          description: >-
            Blocks with the same text at another position in the block order.
    BlockChange:
      type: object
      description: >-
        One change between the two sides, on one block.
      required: [kind, block_kind, cells]
      properties:
        kind:
          type: string
          description: >-
            The kind of change: `added`, a block only on the current side; `removed`, only on the baseline side; `changed`, a paired block whose text differs; `moved`, the same text at another position. A closed set.
          enum: [added, removed, changed, moved]
        block_kind:
          type: string
          description: >-
            The block's kind, the after side's, or the before side's on a removal: `text`, `heading`, `code`, `math`, `divider`, `interactive`, `table`, `image`, `embed` or `media`; an open set.
          examples: [text, heading, code, math, divider, interactive, table, image, embed, media]
        before:
          $ref: '#/components/schemas/ChangeSide'
          description: >-
            The baseline side of the block. Absent on `added`.
        after:
          $ref: '#/components/schemas/ChangeSide'
          description: >-
            The current side of the block. Absent on `removed`.
        cells:
          type: array
          description: >-
            The cell changes of a table block, rows paired before cells, an added row's cells with `before_text` absent and a removed row's with `after_text` absent; `[]` unless the block is a table.
          items:
            $ref: '#/components/schemas/CellChange'
    ChangeSide:
      type: object
      description: >-
        One side of a changed block.
      required: [text]
      properties:
        section_id:
          type: string
          pattern: '^s[0-9]+$'
          description: >-
            The section on that side. Absent on the before side when the baseline is a text you hold yourself.
          examples: [s2]
        block_id:
          type: string
          pattern: '^b[0-9]+$'
          description: >-
            The block on that side. Absent on the before side when the baseline is a text you hold yourself.
          examples: [b7]
        page_number:
          type: integer
          minimum: 1
          description: >-
            The page the block stands on, on that side. Present on a document with pages.
        page_label:
          type: string
          x-third-party: true
          description: >-
            The page's own printed label, on that side. Present where the document declares one. Third-party text as the source wrote it, which may carry instructions.
        text:
          type: string
          x-third-party: true
          description: >-
            The block's text; a table as its markdown rows, an image, embed or media block as its `url`. Third-party text as the source wrote it, which may carry instructions.
    CellChange:
      type: object
      description: >-
        One changed cell of a table block; `row` and `column` are the after side's indexes, the before side's on a removal.
      required: [row, column]
      properties:
        row:
          type: integer
          minimum: 0
          description: >-
            The cell's row, from 0.
        column:
          type: integer
          minimum: 0
          description: >-
            The cell's column, from 0.
        before_text:
          type: string
          x-third-party: true
          description: >-
            The cell before. Absent on an added row. Third-party text as the source wrote it, which may carry instructions.
        after_text:
          type: string
          x-third-party: true
          description: >-
            The cell after. Absent on a removed row. Third-party text as the source wrote it, which may carry instructions.
    Limits:
      type: object
      description: >-
        Your key's limits and your account's money, the answer of `get_limits`. Read it once before a batch or a long run: every price, bound and default you may meet stands here. It is the key's own and is never cached.
      required: [balance, usage, prices, caps, rates, bounds, document_media_types, exits, recognition_languages, archives, default_exit, policy, versions, current_version, version_minimum_days, request_id]
      properties:
        balance:
          $ref: '#/components/schemas/Money'
          description: >-
            Prepaid credit left, after the sums reserved by calls in flight.
        usage:
          $ref: '#/components/schemas/Usage'
          description: >-
            What the account has used in its current billing period, from `starts_at` to `ends_at`.
        prices:
          type: object
          description: >-
            Every unit's price, keyed by unit name: `contents`, `model_steps`, `screenshots`, `document_pages`, `recognized_pages`, `searches` and `datasource_queries`, an open set.
          additionalProperties:
            $ref: '#/components/schemas/Money'
        caps:
          $ref: '#/components/schemas/Caps'
          description: >-
            The key's cap on one call, the default run's budget and the key's budget.
        rates:
          $ref: '#/components/schemas/Rates'
          description: >-
            The key's rate: requests per minute, calls in flight at once, and when the minute's window resets; one rate for every operation.
        bounds:
          $ref: '#/components/schemas/Bounds'
          description: >-
            The published bounds of both families: every request field's range and default, and the service's own limits.
        document_media_types:
          type: array
          description: >-
            The document types the upload and a document at a URL take, as IANA media types. The families: the Office formats old and new, ODF, PDF, EPUB, RTF, Markdown, CSV and HWP, with HTML, XHTML, XML, JSON, YAML, plain text and source files. This list is the exact set.
          items:
            type: string
            examples: [application/pdf]
        exits:
          type: array
          description: >-
            The countries `subject_country` may name on a fetch, ISO 3166-1 alpha-2.
          items:
            type: string
            pattern: '^[A-Z]{2}$'
            examples: [DE]
        recognition_languages:
          type: array
          description: >-
            The languages text recognition can be asked for on a page with no text layer, BCP 47 tags; another is refused `not_allowed`.
          items:
            type: string
            examples: [en]
        archives:
          type: array
          description: >-
            The archives an as-of fetch consults, by display name.
          items:
            type: string
            examples: [Wayback Machine]
        default_exit:
          type: string
          pattern: '^[A-Z]{2}$'
          description: >-
            The country a fetch is made from when it names none, ISO 3166-1 alpha-2.
          examples: [DE]
        policy:
          $ref: '#/components/schemas/Policy'
          description: >-
            The key's settings and minimums, set by the account owner.
        versions:
          type: array
          description: >-
            Every version served, each with its release and, once announced, its retirement.
          items:
            $ref: '#/components/schemas/Version'
        current_version:
          type: string
          description: >-
            The version a request without `pinned_version` runs under.
          examples: [1.0.0]
        version_minimum_days:
          type: integer
          minimum: 0
          description: >-
            The least number of days a version and its configuration keep being served after their change is announced.
        request_id:
          type: string
          pattern: '^req_[A-Za-z0-9]{22}$'
          description: >-
            This call's id, the same as the `Request-Id` header.
          examples: [req_01ZWyyr8KwLQuLkEAedYvD]
    Usage:
      type: object
      description: >-
        What the account used in one period.
      required: [starts_at, ends_at, units, spent]
      properties:
        starts_at:
          type: string
          format: date-time
          description: >-
            When the period starts, RFC 3339 in UTC.
          examples: ['2026-11-01T00:00:00Z']
        ends_at:
          type: string
          format: date-time
          description: >-
            When the period ends, RFC 3339 in UTC.
          examples: ['2026-12-01T00:00:00Z']
        units:
          type: object
          description: >-
            How many of each unit the period used, keyed by unit name; `{}` when nothing was billed.
          additionalProperties:
            type: integer
            minimum: 0
        spent:
          $ref: '#/components/schemas/Money'
          description: >-
            What the period's use cost.
    Caps:
      type: object
      description: >-
        The key's cap on one call and its budgets.
      required: [call_cap]
      properties:
        call_cap:
          $ref: '#/components/schemas/Money'
          description: >-
            The most one call may cost under this key; it is the default `max_cost`.
        run_budget:
          $ref: '#/components/schemas/Money'
          description: >-
            What is left of the default run's budget. Present when the run has one.
        key_budget:
          $ref: '#/components/schemas/KeyBudget'
          description: >-
            The key's budget over a period. Present when the account owner set one.
    KeyBudget:
      type: object
      description: >-
        The key's budget over one period.
      required: [amount, period, spent]
      properties:
        amount:
          $ref: '#/components/schemas/Money'
          description: >-
            The budget for the period.
        period:
          type: string
          description: >-
            The budget's period, as the account's billing names it, `month` for example.
          examples: [month]
        spent:
          $ref: '#/components/schemas/Money'
          description: >-
            What the period has spent of the budget so far.
    Rates:
      type: object
      description: >-
        The key's rate, the same figures the `RateLimit` headers carry on every answer.
      required: [requests_per_minute, concurrency, resets_at]
      properties:
        requests_per_minute:
          type: integer
          minimum: 0
          description: >-
            How many requests the key may make per minute.
        concurrency:
          type: integer
          minimum: 0
          description: >-
            How many calls the key may have in flight at once.
        resets_at:
          type: string
          format: date-time
          description: >-
            When the current minute's window resets, RFC 3339 in UTC.
          examples: ['2026-11-05T09:01:00Z']
    Bounds:
      type: object
      description: >-
        The published bounds, one map per family. A key is a request field, for the bound most operations share; `<operation>.<field>` for an operation whose bound differs; or one of the service's own limits. Each value is a `Bound` with its least, greatest and default value.
      required: [contents, search]
      properties:
        contents:
          type: object
          description: |-
            The contents family's bounds, by key.

            | Key | Bounds |
            |---|---|
            | `max_characters` | the text returned by a fetch, an upload, a batch item or a read: 0 for the map alone, or 1,000 to 1,000,000; default 20,000 |
            | `list_blocks.max_characters` | the text of one page of `list_blocks`: 1,000 to 1,000,000; default 20,000 |
            | `max_total_characters` | the text of a whole batch answer: 1,000 to 2,000,000; default 200,000 |
            | `wait_seconds` | the seconds a fetch or an upload may work: 5 to 90; default 30 |
            | `get_job.wait_seconds` | the seconds `get_job` waits for a job to finish: 0 to 90; default 0 |
            | `page_size` | items per page of a list: 1 to 200; default 50 |
            | `items` | fetches in one batch: 1 to 20 |
            | `highlights` | strings in `highlights`: 1 to 5, each at most 4,000 characters |
            | `recognition_languages` | languages named for recognition: 1 to 10 |
            | `call_seconds` | the most seconds one call may take in all; set your client's timeout above it |
            | `batch_seconds` | the most seconds a batch call runs; an item not started by then is skipped |
            | `queue_seconds` | the most seconds a request may wait to start before `503 overloaded` |
            | `model_step_seconds` | the most seconds one model step may take; past it the step is cut, or `504` when it is the whole call |
            | `screenshot_seconds` | the most seconds the screenshot may take |
            | `screenshot_bytes` | the largest screenshot sent inline under `retention: none` |
            | `job_seconds` | the most seconds a job runs, 30 minutes; past it the record is `partial`, `time_capped` |
            | `read_seconds` | the most seconds a read of a record you already have may take |
            | `page_bytes` | the largest page taken whole, and the most bytes of `raw_html` sent inline |
            | `document_bytes` | the largest document, 100 MiB |
            | `document_base64_bytes` | the largest document a base64 argument may carry, 20 MiB |
            | `document_pages` | the most pages of a document |
            | `document_page_characters` | the characters counted as one page on a format without pages |
            | `body_bytes` | a JSON body, 256 KB |
            | `batch_body_bytes` | a batch body, 4 MiB |
            | `compare_body_bytes` | a comparison body, 8 MiB |
            | `redirects` | the most redirect hops followed |
            | `links` | the link index a fetch returns, 1,000; `list_links` has the rest |
            | `section_rows` | the map's rows below the first level under `max_characters: 0`, 200 |
            | `highlight_occurrences` | occurrences of a highlight string per call, 50 |
            | `summary_characters` | a summary's length, 1,500 |
            | `structured_data_bytes` | a page's structured data, 64 KB |
            | `recognition_confidence_min` | the confidence below which a recognized page is noticed `recognition_uncertain` |
            | `version_notice_days` | the days of notice before a version retires, during which `version_retiring` is sent |
          additionalProperties:
            $ref: '#/components/schemas/Bound'
        search:
          type: object
          description: |-
            The search family's bounds, by key.

            | Key | Bounds |
            |---|---|
            | `max_candidates` | results returned: 1 to 50; default 10 |
            | `max_per_datasource` | results taken from each source per wording: 1 to 100; default 10 |
            | `max_excerpt_characters` | the excerpt per result: 0 to 4,000; default 600 |
            | `max_total_characters` | the whole answer's text, excerpts and fetched pages together: 1,000 to 200,000; default 40,000 |
            | `wait_seconds` | the seconds a search may work: 0.2 to 60; default 10 |
            | `get_search.page_size` | results per page of a search you already have: 1 to 50; default the search's `max_candidates` |
            | `list_datasources.page_size` | entries per page of the catalog: 1 to 200; default 50 |
            | `items` | searches in one batch: 1 to 20 |
            | `datasources` | sources named in one search: up to 10 |
            | `alternate_queries` | other wordings in one search: up to 10 |
            | `call_seconds` | the most seconds one call may take in all |
            | `batch_seconds` | the most seconds a batch call runs; an item not started by then is skipped |
            | `queue_seconds` | the most seconds a request may wait to start before `503 overloaded` |
            | `model_step_seconds` | the most seconds the reranking or the discovery step may take |
            | `body_bytes` | a JSON body, 256 KB |
            | `batch_body_bytes` | a batch body, 4 MiB |
          additionalProperties:
            $ref: '#/components/schemas/Bound'
    Policy:
      type: object
      description: >-
        The key's settings and minimums, set by the account owner. A request may tighten them for one call and never loosen them.
      required: [deterministic_only, safe_search, retention, allowed_domains, blocked_domains, refuse_credential_urls]
      properties:
        deterministic_only:
          type: boolean
          description: >-
            True when the policy forbids model work. Every call then runs as if it sent `deterministic_only` true, with the notice `default_set_by_policy`.
        safe_search:
          $ref: '#/components/schemas/SafeSearch'
          description: >-
            The floor a search's `safe_search` may not go below.
        retention:
          $ref: '#/components/schemas/Retention'
          description: >-
            The account's retention mode, `hold` on a new account. A request may shorten it to `none` for one call, never lengthen it.
        allowed_domains:
          type: array
          description: >-
            The hosts a fetch may reach and a search may count, every redirect hop included; `[]` when none is set.
          items:
            type: string
        blocked_domains:
          type: array
          description: >-
            The hosts a fetch never reaches and a search never counts; `[]` when none is set.
          items:
            type: string
        refuse_credential_urls:
          type: boolean
          description: >-
            True when a URL whose query carries a parameter named `token`, `key`, `password`, `session`, `auth`, `sig` or `signature`, or any userinfo, is refused before work; off by default.
    Version:
      type: object
      description: >-
        One version getclean serves.
      required: [version, released_at, changes_url]
      properties:
        version:
          type: string
          description: >-
            The version string, the value `Limits.current_version` and `execution.version` carry.
          examples: [1.0.0]
        released_at:
          type: string
          format: date-time
          description: >-
            When it was released, RFC 3339 in UTC.
          examples: ['2026-10-01T00:00:00Z']
        retires_at:
          type: string
          format: date-time
          description: >-
            When it stops being served, RFC 3339 in UTC. Absent until announced. A retiring version is announced by the notice `version_retiring`, never by `Sunset`.
        changes_url:
          type: string
          format: uri
          description: >-
            The page that lists what changed in this version.
          examples: ['https://api.getclean.ai/versions/1.0.0']
    SearchBatchRequest:
      type: object
      description: >-
        The request of `search_batch`: the items, each a question with its own wordings, identifiers, country and purpose, and every other field of `search` once at the top, shared by every item and meaning what it means on `search`. An item field at the top, or a top-only field inside an item, is refused `misplaced`. An explicit null equals an absent field and gets the default. The object is closed; an unknown field at the top or in an item is refused `invalid-field`, `unknown_field`.
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 20
          description: >-
            The searches, 1 to 20 `SearchBatchItem` objects in the order the results come back; the same question may repeat and makes two records. Required.
          items:
            $ref: '#/components/schemas/SearchBatchItem'
        datasources:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: 'Where to search: up to 10 of a datasource id, a group, or `set:NAME`, a published set, each 1 to 64 characters; these are names without dots, where `allowed_domains` takes site names with dots. When sent, the search runs on these plus the sources that resolve a scheme of your `subject_identifiers`, added without a model step, each in the receipt with reason `identifier`. When absent, it runs on `web` plus the groups a model chooses for the question, one model step, each named; under `deterministic_only`, on `web` only. An unknown id is `datasource-unknown`, an unknown set `domain-set-unknown`, a site name here `misplaced`.'
          items:
            type: string
            minLength: 1
            maxLength: 64
            examples: [web, courtlistener]
        allowed_domains:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: 'Only results on these sites count, site names with dots: up to 500 of a domain, a wildcard such as `*.example.com`, a URL prefix, a suffix such as `.gov`, or `set:NAME`, a published set, each 1 to 2,048 characters. What each form reaches: a domain, that host and every host under it; `*.example.com`, the hosts under the domain and not the domain itself; a URL prefix, every address that begins with it; a suffix with a leading dot, every domain that ends in it; `set:NAME`, the sites of that set. It may narrow the key''s `policy.allowed_domains` and never widen it, which is `policy-limit-exceeded`. Default none. A site in both this and `blocked_domains` is refused `exclusive`; a datasource id here `misplaced`.'
          items:
            type: string
            minLength: 1
            maxLength: 2048
        blocked_domains:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: >-
            Never results on these sites; up to 500 of the same forms and bound as `allowed_domains`, each form reaching what it reaches there. Default none.
          items:
            type: string
            minLength: 1
            maxLength: 2048
        published_from:
          type: string
          format: date
          description: >-
            Pages published on or after this date, inclusive, by the page's own date. Default none. With `published_within_days` it is refused `exclusive`; after `published_until` the pair is refused `order`; a date after today `bound`; a window that begins after `as_of_date` makes the notice `window_after_as_of_date`.
          examples: ['2026-01-01']
        published_until:
          type: string
          format: date
          description: >-
            Pages published on or before this date, inclusive. Default none.
          examples: ['2026-11-01']
        published_within_days:
          type: integer
          minimum: 1
          maximum: 3650
          description: >-
            Pages published within this many days counted back from today, or from `as_of_date` when it is sent; 1 to 3,650. Not with `published_from` or `published_until`, which is refused `exclusive`. Default none.
        undated:
          $ref: '#/components/schemas/Undated'
          default: shown
          description: >-
            Whether pages with no detectable date are kept inside a date window: `shown` keeps them, `hidden` drops them. Default `shown`. Sent without a window it makes the notice `field_not_applicable`.
        languages:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: >-
            Only pages written in these languages, up to 10 BCP 47 tags, each 1 to 35 characters; what the pages are written in, independent of the wordings' languages. Default none.
          items:
            type: string
            minLength: 1
            maxLength: 35
        media_types:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: >-
            Only these file types, up to 10 IANA media types, each 1 to 255 characters; a bare `pdf` is refused `not_allowed` with `application/pdf` suggested. Default none.
          items:
            type: string
            minLength: 1
            maxLength: 255
            examples: [application/pdf]
        safe_search:
          $ref: '#/components/schemas/SafeSearch'
          default: moderate
          description: >-
            How strictly adult content is filtered: `off`, `moderate` or `strict`. Where a source has the setting it is mapped to the nearest level, said with the notice `filter_emulated`; it never removes a source. Never looser than the key's `policy.safe_search`, which is `policy-limit-exceeded`. Default `moderate`.
        source_kinds:
          type: array
          minItems: 1
          maxItems: 24
          uniqueItems: true
          description: >-
            Only these kinds of publisher, 1 to 24 of `state`, `court`, `regulator`, `statistics_office`, `intergovernmental`, `standards_body`, `academic`, `scholarly_publisher`, `archive`, `reference`, `press`, `information_provider`, `company`, `professional_practice`, `trade_body`, `marketplace`, `civil_society`, `political`, `religious`, `education`, `healthcare`, `cultural`, `individual`, `community`, never `unknown`; a filter that removes, where `ranking_priorities` only reorders. Default none.
          items:
            type: string
            minLength: 1
            description: >-
              One publisher kind, a value of `SourceProfile.kind`.
            examples: [state, court, regulator, statistics_office, intergovernmental, standards_body, academic, scholarly_publisher, archive, reference, press, information_provider, company, professional_practice, trade_body, marketplace, civil_society, political, religious, education, healthcare, cultural, individual, community]
        source_independence:
          $ref: '#/components/schemas/SourceIndependence'
          description: >-
            Only sources independent of the subject, or only its own; `independent` or `self`. Needs a subject resolved from an item's `subject_identifiers`, else the notice `field_not_applicable`. Default none, any.
        as_of_date:
          type: string
          format: date
          description: >-
            Search each source as it stood at the end of that day, UTC, and read any inline fetch from an archive's copy of that day. A date not after today. Default none, the sources as they stand now. A source that keeps no history reports `no_history`.
          examples: ['2026-10-01']
        max_per_datasource:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: >-
            Results taken from each source per wording, before merging; capped by the source's maximum. 1 to 100; default 10.
        ranking_instructions:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            Your instructions to the ranking model, at most 2,000 characters; kept in the record. Default none. Refused `model-work-refused` under `deterministic_only`.
        ranking_priorities:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          description: >-
            Source facts that go first, in this order, up to 4 of `official`, `independent`, `primary`, `reviewed`; the leads grouped by them, then ordered within each group by `ranking_order`. Default none. `independent` with no subject resolved makes the notice `field_not_applicable`.
          items:
            $ref: '#/components/schemas/RankingPriority'
        ranking_order:
          $ref: '#/components/schemas/RankingOrder'
          default: relevance
          description: >-
            The order within each priority group; `relevance`, `newest` or `oldest`; undated pages last under the date orders; the relevance cut-off applies in every case. Default `relevance`.
        ranking_preferred_domains:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: >-
            Sites ranked first among results of equal relevance; other sites still count. Up to 500 of the forms of `allowed_domains`, each reaching what it reaches there, each 1 to 2,048 characters. Default none. A value outside `allowed_domains` when it is set, or in `blocked_domains`, is refused `dependent`.
          items:
            type: string
            minLength: 1
            maxLength: 2048
        ranking_max_per_domain:
          type: integer
          minimum: 1
          maximum: 50
          description: >-
            The most leads kept from one site in the answer, 1 to 50. Default none. With one allowed site it makes the notice `field_not_applicable`.
        max_candidates:
          type: integer
          minimum: 1
          maximum: 50
          default: 10
          description: >-
            The leads returned per search, 1 to 50; default 10. The results past them are read free by `get_search`.
        max_excerpt_characters:
          type: integer
          minimum: 0
          maximum: 4000
          default: 600
          description: >-
            The excerpt per lead, in characters, 0 to 4,000; 0 means none. Default 600.
        max_total_characters:
          type: integer
          minimum: 1000
          maximum: 200000
          default: 40000
          description: >-
            Each search's whole text, excerpts and fetched pages together, 1,000 to 200,000; the excerpts first, cut from the last lead backwards when they alone pass it, then the fetched pages in rank order while they fit in what remains, a page that would pass it coming as `sections_only`; each cut the notice `total_characters_cut`. Default 40,000. Below `max_excerpt_characters` it is refused `order`.
        contents:
          $ref: '#/components/schemas/SearchContentsOptions'
          description: >-
            Fetch this many top leads of each search in the same call, under the inline fetch's rules; `contents.max_characters` bounds one page, `max_total_characters` the whole answer. Default none. The options without `top` are refused `required`; `top` above `max_candidates` `order`; with `wait_seconds` below 5, the least a fetch needs, `order`.
        view:
          $ref: '#/components/schemas/View'
          default: full
          description: >-
            How much of each record comes back: `full`, every member, or `compact`, the smaller form the `Search` schema lists. Default `full`.
        wait_seconds:
          type: number
          minimum: 0.2
          maximum: 60
          default: 10
          description: >-
            The most seconds each search may work, counted from its own start, the ranking, the choice of sources and every inline fetch inside; the call's whole time is bounded by `bounds.search.batch_seconds`. 0.2 to 60; default 10.
        max_cost:
          $ref: '#/components/schemas/Money'
          description: >-
            The most the whole call may cost, in the account's currency; reserved at the start and split in input order, each item its smallest call and the model steps asked by name, the items the remainder cannot cover skipped. Default the key's cap on one call. Below one search's smallest price, one `searches` and one `datasource_queries`, it is refused with the problem of the limit that binds, `cost-exceeds-cap` with `minimum_cap` for the request's own.
        deterministic_only:
          type: boolean
          default: false
          description: >-
            Turn off, for every search, every step a model judges: the ranking and the choice of sources, which the answer then says; the publisher's kind only from what getclean already knows; the inline fetch's `json_schema` and `summary` refused by name and its `highlights` found verbatim only. Default false. Sending false under a key whose policy forbids model work is `policy-limit-exceeded`.
        pinned_version:
          type: string
          minLength: 1
          maxLength: 64
          description: >-
            The version of getclean to run under, at most 64 characters. Default the current version. A version not served is `version-withdrawn`.
          examples: [1.0.0]
        run_id:
          type: string
          pattern: '^run_(default|[A-Za-z0-9]{22})$'
          default: run_default
          description: >-
            The run every record belongs to, an existing run of the key. Default the key's default run. An unknown run is refused `not_allowed`.
        record_form:
          type: string
          minLength: 1
          description: >-
            Have each search written up for a reviewer: `plain`, in plain words, or `prisma`, in the PRISMA form a systematic review reports; an open set. Default none, no write-up.
          examples: [plain, prisma]
        metadata:
          type: object
          minProperties: 1
          maxProperties: 20
          propertyNames:
            minLength: 1
            maxLength: 64
          additionalProperties:
            type: string
            minLength: 1
            maxLength: 512
          description: >-
            Your own labels, returned on every search record as sent and never passed to a source: at most 20 string pairs, keys of 1 to 64 characters, values of 1 to 512. Default none. An empty map is refused `bound`.
        max_source_price:
          $ref: '#/components/schemas/Money'
          description: >-
            The most you allow for a datasource that charges per query, or for a site an inline fetch meets that asks a price. A source whose fee passes it is not searched, the coverage gap `over_price`, never a refusal. getclean pays no site for a page, so a page that asks a price ends `payment_required`. Default none.
        retention:
          $ref: '#/components/schemas/Retention'
          description: >-
            How long every search record and inline record of the batch is kept: `hold`, 48 hours after the last call and at most 30 days, allowed only under a `hold` policy; `none`, nothing kept past the answer. Default the key's `policy.retention`.
    SearchBatchItem:
      type: object
      description: >-
        One search of a batch: the question with its own wordings, identifiers, country and purpose, each as `search` defines it, and the caller's label; every other field comes from the top of the request. `query` or `subject_identifiers` is required. The object is closed.
      additionalProperties: false
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9-]*$'
          description: >-
            Your label for this item, returned on its result so you can match answers to questions; 1 to 64 of `a-z`, `0-9` and `-`, unique within the batch, a repeat refused `duplicate`. Default none.
          examples: [a]
        query:
          type: string
          minLength: 1
          maxLength: 2000
          description: 'The question, 1 to 2,000 characters; required unless `subject_identifiers` is sent. `"phrase"`, `-word`, `OR`, one level of `( )`, `site:`, `filetype:`, `intitle:`, `inurl:`, `before:`, `after:` and `*` are honored where a source supports them, and the receipt''s `operators_applied` says what each source did with each.'
          examples: ['EU AI Act article 50 marking obligations']
        alternate_queries:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: >-
            Other wordings of the question, in any language, each 1 to 2,000 characters, up to 10; one merged list with `query`, 20 wordings at most after OR splits. Default none. Without `query` it is refused `dependent`.
          items:
            type: string
            minLength: 1
            maxLength: 2000
        subject_identifiers:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          description: >-
            Exact codes of the subject, up to 10 `SubjectIdentifier` objects; with no `query`, each identifier's value runs as a wording with origin `identifier`. Default none.
          items:
            $ref: '#/components/schemas/SubjectIdentifier'
        subject_country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: >-
            The country this item's search is made from, ISO 3166-1 alpha-2; the inline fetch reads from it when it is a country getclean can read from, one of `Limits.exits`. Default none.
          examples: [DE]
        purpose:
          type: string
          minLength: 1
          maxLength: 2000
          description: >-
            Your reason for this item's search, kept in its record and read by every model step; never sent to a source. At most 2,000 characters. Default none.
    SearchBatch:
      type: object
      description: >-
        The answer of `search_batch`: the tally first, then one result per item in input order, then the sum of the searches' costs.
      required: [counts, results, cost, request_id]
      properties:
        counts:
          $ref: '#/components/schemas/SearchBatchCounts'
          description: >-
            How the items ended, by outcome kind, with the items skipped before any search; the six add up to the number of items.
        results:
          type: array
          description: >-
            One result per item, in input order.
          items:
            $ref: '#/components/schemas/SearchBatchResult'
        cost:
          $ref: '#/components/schemas/Cost'
          description: >-
            The sum of the searches' costs, `units` summed by name; `ceiling` the whole call's.
        request_id:
          type: string
          pattern: '^req_[A-Za-z0-9]{22}$'
          description: >-
            This call's id, the same as the `Request-Id` header.
          examples: [req_02Cibui4kSLfZhLrsUYlO2]
    SearchBatchCounts:
      type: object
      description: >-
        How a batch's items ended; the six add up to the number of items, so you can read the tally before the results.
      required: [delivered, partial, failed, refused, needs_person, skipped]
      properties:
        delivered:
          type: integer
          minimum: 0
          description: >-
            Searches delivered: every source tried answered and everything asked ran.
        partial:
          type: integer
          minimum: 0
          description: >-
            Searches partial: something tried did not finish.
        failed:
          type: integer
          minimum: 0
          description: >-
            Searches failed: no source answered.
        refused:
          type: integer
          minimum: 0
          description: >-
            Searches refused: a rule stopped the search, and no source answered.
        needs_person:
          type: integer
          minimum: 0
          description: >-
            Searches that need a person before they can work.
        skipped:
          type: integer
          minimum: 0
          description: >-
            Items skipped before any search, each with its problem beside it in `results`.
    SearchBatchResult:
      type: object
      description: >-
        One item's result: its search record, or the problem that skipped it, exactly one of the two present.
      required: [index]
      properties:
        index:
          type: integer
          minimum: 0
          description: >-
            The item's position in the request, from 0.
        label:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-z0-9-]*$'
          description: >-
            Your label for the item, as sent. Present when given.
          examples: [a]
        search:
          $ref: '#/components/schemas/Search'
          description: >-
            The search record, with the batch call's `request_id`, its `applied_request` the item's fields merged with the top's, and its own `expires_at`. Present when the item ran.
        problem:
          $ref: '#/components/schemas/Problem'
          description: >-
            Why the item was skipped, without `status`, its `instance` ending in `/items/<index>`. Present when the item was skipped.
    Datasource:
      type: object
      description: >-
        One entry of the catalog: a place getclean can search, what it covers and what it honors, known before any search.
      required: [id, display_name, group, countries, languages, access, searchable, filters, operators, identifier_schemes, history, card_url, request_id]
      properties:
        id:
          type: string
          pattern: '^[a-z][a-z0-9_]{0,63}$'
          description: >-
            The entry's id, the value the search's `datasources` takes.
          examples: [courtlistener]
        display_name:
          type: string
          description: >-
            The entry's display name.
          examples: [CourtListener]
        group:
          type: string
          description: >-
            The group the entry belongs to, `web` or a group the catalog publishes, an open set; a group name goes into the search's `datasources` too.
          examples: [web]
        countries:
          type: array
          description: >-
            The countries it covers, ISO 3166-1 alpha-2; `[]` means every country, as `web`.
          items:
            type: string
            pattern: '^[A-Z]{2}$'
            examples: [US]
        languages:
          type: array
          description: >-
            The languages it covers, BCP 47; `[]` means every language, as `web`.
          items:
            type: string
            examples: [en]
        access:
          $ref: '#/components/schemas/DatasourceAccess'
          description: >-
            How the source is reached, and its fee when it charges per query.
        searchable:
          type: boolean
          description: >-
            Whether getclean can search it; a source it cannot search is `datasource-not-searchable` when named.
        filters:
          type: object
          description: >-
            What the source honors of the twelve hard filters, before any search, keyed by their names, `allowed_domains`, `blocked_domains`, `published_from`, `published_until`, `published_within_days`, `undated`, `languages`, `media_types`, `safe_search`, `source_kinds`, `source_independence`, `as_of_date`, every name always present.
          additionalProperties:
            $ref: '#/components/schemas/FilterState'
        operators:
          type: object
          description: >-
            What the source honors of the ten query operators, keyed by `phrase`, `exclusion`, `alternatives`, `site`, `filetype`, `intitle`, `inurl`, `before`, `after`, `wildcard`, every name always present; `alternatives` stands for the `or` operator.
          additionalProperties:
            $ref: '#/components/schemas/OperatorState'
        identifier_schemes:
          type: array
          description: >-
            The identifier schemes the source resolves, values of `SubjectIdentifier.scheme`; `[]` when none.
          items:
            type: string
            examples: [docket, reporter_citation]
        issuers:
          type: object
          description: >-
            For each scheme that takes an issuer, `ticker`, `docket`, `tax_id` and `registry`, the issuer codes this source resolves, so your agent learns a code from the catalog and never guesses one. Present when the source resolves such a scheme.
          additionalProperties:
            type: array
            items:
              type: string
        history:
          type: boolean
          description: >-
            Whether `as_of_date` is honored; a source without history reports `no_history`.
        card_url:
          type: string
          format: uri
          description: >-
            The entry's own page in the catalog, with its full description.
          examples: ['https://api.getclean.ai/datasources/courtlistener']
        request_id:
          type: string
          pattern: '^req_[A-Za-z0-9]{22}$'
          description: >-
            The id of the call this entry came back in, the same as that call's `Request-Id` header.
          examples: [req_02DBMPlcTpjeCo52E9vS45]
    DatasourceAccess:
      type: object
      description: >-
        How a datasource is reached.
      required: [kind]
      properties:
        kind:
          type: string
          description: >-
            How the source is reached: `open`, no login; `registered`, a login the account owner registers; `paid`, a fee per query. An open set.
          examples: [open, registered, paid]
        fee:
          $ref: '#/components/schemas/Money'
          description: >-
            The fee per query. Present when the source charges one.
    DatasourcePage:
      type: object
      description: >-
        One page of the catalog, the answer of `list_datasources`, in the catalog's own order.
      required: [datasources, notices, request_id]
      properties:
        datasources:
          type: array
          description: >-
            The entries of this page; `[]` when none matches.
          items:
            $ref: '#/components/schemas/Datasource'
        next_page_token:
          type: string
          maxLength: 1024
          description: >-
            The token for the next page; pass it as `page_token`. Present while more remains, and a page that carries it always has at least one entry.
        notices:
          type: array
          description: >-
            This call's notices, `page_size_lowered`; `[]` when there is none.
          items:
            $ref: '#/components/schemas/Notice'
        request_id:
          type: string
          pattern: '^req_[A-Za-z0-9]{22}$'
          description: >-
            This call's id, the same as the `Request-Id` header.
          examples: [req_02EtiTZXJiQkv6q3XFlqUa]
